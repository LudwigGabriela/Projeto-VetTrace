# ============================================================
# Nginx do VetTrace — um container, dois papéis:
#   porta 80   → serve as páginas (HTML/CSS/JS/imagens)
#   porta 5000 → proxy reverso: repassa as chamadas da API para o
#                container "backend" pela rede interna do Docker
# Guia: docs/docker.md
# ============================================================

# DNS interno do Docker. Com ele o nome "backend" é resolvido a cada
# requisição, não só quando o Nginx sobe: se o container do backend for
# recriado (e ganhar outro IP), o proxy continua funcionando sem restart.
resolver 127.0.0.11 valid=10s ipv6=off;

# ------------------------------------------------------------
# Páginas
# ------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    server_tokens off;      # não anuncia a versão do Nginx
    absolute_redirect off;  # redirects relativos: o navegador continua na porta 8080

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Porta de entrada do sistema
    location = / {
        return 302 /paginas/login.html;
    }

    # Usado pelo healthcheck do docker-compose.yml
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # js/editar-residuo não tem extensão .js. Sem isto o Nginx o enviaria como
    # application/octet-stream e o navegador (por causa do nosniff) bloquearia o script.
    location = /js/editar-residuo {
        default_type text/javascript;
    }

    # HTML/CSS/JS: o navegador sempre confere se mudou (responde 304 quando não mudou),
    # então ninguém fica preso a uma versão antiga depois de um rebuild.
    location ~* \.(html|css|js)$ {
        expires -1;
    }

    location /assets/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ------------------------------------------------------------
# API — proxy reverso para o Flask
# O JavaScript do frontend chama http://127.0.0.1:5000; essa porta do host
# aponta para cá, e daqui a requisição segue para backend:5000.
# ------------------------------------------------------------
server {
    listen 5000;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        # Usar variável obriga o Nginx a consultar o resolver acima
        set $backend_api http://backend:5000;
        proxy_pass $backend_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
