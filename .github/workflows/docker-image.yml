name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      - name: Build with Docker Compose
        run: docker compose build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vettrace
          POSTGRES_PASSWORD: vettrace
          POSTGRES_DB: vettrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vettrace -d vettrace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install dependencies
        run: pip install -r backend_vet/requirements.txt

      - name: Create test database schema
        env:
          PGPASSWORD: vettrace
        run: |
          psql -v ON_ERROR_STOP=1 \
            -h localhost \
            -U vettrace \
            -d vettrace_test \
            -f db/schema.sql

      - name: Run tests
        working-directory: backend_vet
        env:
          DATABASE_URL: postgresql://vettrace:vettrace@localhost:5432/vettrace_test
          TEST_DATABASE_URL: postgresql://vettrace:vettrace@localhost:5432/vettrace_test
          COVERAGE_FILE: /tmp/.coverage
        run: |
          pytest --cov=app --cov-report=term-missing -p no:cacheprovider tests
