<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetTrace - Descarte de Resíduos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>

    <!-- Sidebar Fixa -->
    <aside class="sidebar-fixed">
        <div class="sidebar-header">
            <img src="../assets/logo-vet-trace.png" alt="Logo" style="height: 40px; width: auto;">
            <div>
                <h1>VetTrace</h1>
                <p>Sistema de Rastreabilidade Clínica</p>
            </div>
        </div>

        <nav class="sidebar-nav">

            <a href="descarte-cadaver.html" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="5" r="2" />
                    <circle cx="6" cy="9" r="2" />
                    <circle cx="18" cy="9" r="2" />
                    <path d="M9 14c-1.5 0-3 1.5-3 3.5 0 2 2.5 3.5 6 3.5s6-1.5 6-3.5c0-2-1.5-3.5-3-3.5H9z" />
                </svg>
                <span>Registra Cadáveres</span>
            </a>
        </nav>
    </aside>

    <!-- Painel de Conteúdo -->
    <main class="content-panel">
        <div class="main-card">

            <!-- Top Bar -->
            <div class="main-header">
                <h2>EDITAR REGISTRO DE CADÁVERES</h2>

            </div>

            <div class="main-body">


                <!-- Formulário de Registro -->
                <div class="section-card">
                    <div class="section-header">
                        <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                        <h3>EDITAR REGISTRO DE CADÁVER</h3>
                    </div>
                    <div class="section-body">
                        <div class="form-row">
                            <div class="form-group flex-60">
                                <label class="form-label">Nome do Animal</label>
                                <input type="text" class="form-control" id="form-cadaver-input-nome"
                                    placeholder="Ex: Bob, Mel">
                            </div>
                            <div class="form-group flex-40">
                                <label class="form-label">Peso (kg)</label>
                                <input type="number" class="form-control" id="form-cadaver-input-peso" placeholder="0.0"
                                    step="0.1" min="0">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group flex-100">
                                <label class="form-label">Nome do Proprietário</label>
                                <input type="text" class="form-control" id="form-cadaver-input-nome-proprietario"
                                    placeholder="Nome completo do tutor">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group flex-60">
                                <label class="form-label">Espécie</label>
                                <select class="form-control" id="form-cadaver-input-especie">
                                    <option value="" disabled selected>Selecione a espécie</option>
                                    <option value="Canino">Canino</option>
                                    <option value="Felino">Felino</option>
                                    <option value="Equino">Equino</option>
                                    <option value="Bovino">Bovino</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                            <div class="form-group flex-40">
                                <label class="form-label">Idade</label>
                                <input type="number" min="0" class="form-control" id="form-cadaver-input-idade"
                                    placeholder="Ex: 5 anos, 3 meses">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group flex-60">
                                <label class="form-label">Causa do Óbito</label>
                                <input type="text" class="form-control" id="form-cadaver-input-causa"
                                    placeholder="Causa da morte">
                            </div>
                            <div class="form-group flex-40">
                                <label class="form-label">Retirada</label>
                                <select class="form-control" id="form-cadaver-input-destino">
                                    <option value="" disabled selected>Selecione o grupo/destino</option>
                                    <option value="1">Labocien</option>
                                    <option value="2">Empresa Terceirizada (descarte)</option>
                                    <option value="3">Proprietário</option>
                                </select>
                            </div>
                        </div>

                        <!-- Campos de Data e Hora do Registro de Descarte -->
                        <div class="form-row">
                            <div class="form-group flex-60">
                                <label class="form-label">Data de Entrada</label>
                                <input type="date" class="form-control" id="form-cadaver-input-data-entrada">
                            </div>
                            <div class="form-group flex-40">
                                <label class="form-label">Hora de Entrada</label>
                                <input type="time" class="form-control" id="form-cadaver-input-hora-entrada">
                            </div>
                        </div>

                        <!-- Campos de Data e Hora de Saída -->
                        <div class="form-row">
                            <div class="form-group flex-60">
                                <label class="form-label">Data de Saída</label>
                                <input type="date" class="form-control" id="form-cadaver-input-data-saida">
                            </div>
                            <div class="form-group flex-40">
                                <label class="form-label">Hora de Saída</label>
                                <input type="time" class="form-control" id="form-cadaver-input-hora-saida">
                            </div>
                        </div>

                        <!--
                        <div class="form-row">
                            <div class="form-group flex-100">
                                <label class="form-label">Responsável pelo Registro</label>
                                <input type="text" class="form-control" placeholder="Nome do profissional responsável">
                            </div>
                        </div>
                        -->

                        <div class="form-row">
                            <div class="form-group flex-100">
                                <label class="form-label">Observações</label>
                                <textarea class="form-control" id="form-cadaver-input-observacao"
                                    placeholder="Adicione informações adicionais sobre o descarte..."></textarea>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="btn btn-cancel" id="form-cadaver-btn-cancelar">Cancelar</button>
                            <button class="btn btn-magenta" id="form-cadaver-btn-submit">Salvar Alterações</button>
                        </div>
                    </div>
                </div>


                <footer class="copyright">
                    © 2026 VetTrace. Projeto Integrador III.
                </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
